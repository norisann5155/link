<html lang="ja">
<head>

  <title>マイリンク</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #f4f5f7; /* まぶしさを抑えた落ち着いたニュートラルグレー */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 14px 60px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #5c626d; /* 目に刺さらないソフトなダークグレー */
      margin-bottom: 20px;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }
    .card {
      position: relative;
      width: 100%;
      height: 108px;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 6px;
      touch-action: manipulation;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .card:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .card-icon {
      font-size: 28px;
      line-height: 1;
      margin-bottom: 6px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.04));
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #272a30;
      line-height: 1.3;
      text-align: center;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-badge {
      margin-top: 5px;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }
  </style>
</head>
